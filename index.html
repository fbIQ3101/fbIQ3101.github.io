<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2463eb">
<title>Referee Desk</title>
<style>
:root{--bg:#f4f6f9;--fg:#111827;--card:#fff;--bd:#e1e5eb;--mut:#6b7280;--acc:#2463eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--fg:#e8eaee;--card:#1a1f29;--bd:#2c3340;--mut:#9aa3b2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--fg:#e8eaee;--card:#1a1f29;--bd:#2c3340;--mut:#9aa3b2;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input[type=color]{padding:2px;height:42px}
button{font:inherit;font-weight:600;padding:9px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sc{border-radius:16px;padding:14px 8px;text-align:center;font-weight:700;cursor:pointer;user-select:none}
.sc b{display:block;font-size:56px;line-height:1.05}
.sc small{display:block;font-weight:500;opacity:.8;font-size:12px}
.clk{font-size:76px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
#cd{margin-left:8px}
.tb{display:grid;grid-template-columns:1fr;gap:8px}
.tb button{min-height:50px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kp button{min-height:46px;font-size:20px;padding:0}
input.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.r.dl{cursor:pointer}
.alm{position:fixed;top:0;left:0;right:0;z-index:20;background:#dc2626;color:#fff;text-align:center;padding:calc(16px + env(safe-area-inset-top,0px)) 10px 16px;font-weight:700;font-size:18px;cursor:pointer}
.rw{display:flex;gap:6px;margin-bottom:6px}
.rw input{min-width:0}
.rw input.pn{width:64px;flex:none}
.rw input.pm,.rw input.pr{flex:1}
.rw button{padding:0 12px;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:99px;padding:6px 14px;font-size:14px}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.th{border-radius:8px;padding:6px 10px;font-weight:700;margin-bottom:6px}
.sh{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:10px 0 2px}
.r{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border-bottom:0}
.m{min-width:48px;font-weight:700;font-variant-numeric:tabular-nums}
.ic{width:22px;text-align:center;flex:none}
.cd{display:inline-block;width:13px;height:18px;border-radius:2px;vertical-align:middle}
.y{background:#facc15}.rd{background:#dc2626}.yr{background:linear-gradient(135deg,#facc15 50%,#dc2626 50%)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.mut{color:var(--mut);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:5}
.bar button{flex:1;min-height:50px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;max-height:90dvh;overflow:auto}
.md textarea{height:260px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input,select,textarea{font-size:16px}
button,.sc,.r{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}body{overscroll-behavior-y:contain}
@media(max-width:640px){.g2{grid-template-columns:1fr}.sc b{font-size:48px}}
@media(max-width:380px){.wrap{padding:10px 10px 90px}.card{padding:10px}.clk{font-size:62px}.sc b{font-size:40px}button{padding:8px 10px}.kp button{min-height:42px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="ov"></div>
<div id="alm" class="alm" onclick="ackAlarm()" hidden>⏱ Zeit abgelaufen – hier tippen, um den Ton zu stoppen</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='refereeDesk.v2',PN=['1. Halbzeit','2. Halbzeit','Verlängerung 1','Verlängerung 2'],GOAL=['Tor','Eigentor','Strafstoß-Tor'],CARD=['Gelbe Karte','Gelb-Rote Karte','Rote Karte'];
const fresh=()=>({screen:'setup',h:{n:'Heim',c:'#2463eb'},a:{n:'Gast',c:'#dc2626'},half:45,et:0,p:0,active:false,run:false,base:0,t0:0,kos:[],f:'k',ev:[],id:0});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const opp=s=>s==='h'?'a':'h';
const etm=()=>S.et==null?15:S.et;
const maxP=()=>etm()?4:2;
const rdP=s=>[...document.querySelectorAll('#'+s+'p .rw')].map(r=>({n:r.querySelector('.pn').value.trim(),nm:r.querySelector('.pm').value.trim()})).filter(x=>/^\d{1,3}$/.test(x.n)).map(x=>({n:String(parseInt(x.n,10)),nm:x.nm}));
const rdO=s=>[...document.querySelectorAll('#'+s+'o .rw')].map(r=>({nm:r.querySelector('.pm').value.trim(),r:r.querySelector('.pr').value.trim()})).filter(x=>x.nm);
const OF=s=>(s==='h'?S.h:S.a).of||[];
const pname=(s,n)=>{const p=((s==='h'?S.h:S.a).pl||[]).find(x=>x.n===String(parseInt(n,10)));return p?p.nm:''};
const nmx=e=>e.num&&pname(e.side,e.num)?' '+pname(e.side,e.num):'';
const tn=s=>s==='h'?S.h.n:s==='a'?S.a.n:'Spiel';
const col=s=>s==='h'?S.h.c:s==='a'?S.a.c:'#888888';
const ink=c=>{const x=c.replace('#','');return .299*parseInt(x.slice(0,2),16)+.587*parseInt(x.slice(2,4),16)+.114*parseInt(x.slice(4,6),16)>155?'#000':'#fff'};
const pad=n=>String(n).padStart(2,'0');
const sec=()=>S.base+(S.run?(Date.now()-S.t0)/1000:0);
const closeOv=()=>{$('#ov').innerHTML=''};
function score(){let h=0,a=0;S.ev.forEach(e=>{if(GOAL.includes(e.type))e.sc==='h'?h++:a++});return[h,a]}
let MO=null;
function tnow(){if(!S.p)return 0;const m=Math.floor(sec()/60)+1;return S.p<=2?(S.p-1)*S.half+m:2*S.half+(S.p-3)*etm()+m}
function minute(){
  if(!S.p)return'0’';
  const m=Math.floor(sec()/60)+1;
  if(S.p>2)return'V'+m+'’';
  if(m>S.half)return S.p*S.half+'+'+(m-S.half)+'’';
  return(S.p-1)*S.half+m+'’';
}
function add(side,type,o){
  S.ev.push(Object.assign({id:++S.id,min:minute(),t:tnow(),per:S.p?PN[S.p-1]:'Vor dem Spiel',side,type,num:'',reason:'',det:'',who:'',sc:side},MO||{},o||{}));
  MO=null;save();render();try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}
/* ---------- Dialoge ---------- */
function ask(title,fields,ok,msg,btn){
  let h='<div class="ov"><div class="md"><h3>'+esc(title)+'</h3>'+(msg?'<p>'+esc(msg)+'</p>':'');
  fields.forEach(f=>{
    h+='<label>'+esc(f.l)+'</label>';
    if(f.t==='select')h+='<select id="f_'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select>';
    else if(f.t==='area')h+='<textarea id="f_'+f.k+'" rows="3"></textarea>';
    else h+='<input id="f_'+f.k+'" autocomplete="off"'+(f.n?' data-n="1" readonly inputmode="none"':'')+'>'+(f.s?'<div class="mut" id="nm_'+f.k+'" style="min-height:18px"></div>':'');
  });
  if(fields.some(f=>f.n))h+='<div class="kp" id="kp">'+['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>';
  h+='<div class="row" style="margin-top:14px;justify-content:flex-end"><button id="no">Abbrechen</button><button class="pri" id="yes">'+(btn||'OK')+'</button></div></div></div>';
  $('#ov').innerHTML=h;
  const first=$('#ov input,#ov select,#ov textarea');if(first)first.focus();
  const nin=[...$('#ov').querySelectorAll('input[data-n]')];let cur=nin[0];
  const mark=()=>nin.forEach(i=>i.classList.toggle('act',i===cur));
  nin.forEach(i=>{i.onfocus=()=>{cur=i;mark()};i.onclick=i.onfocus});mark();
  const key=k=>{if(!cur)return;cur.value=k==='C'?'':k==='⌫'?cur.value.slice(0,-1):(cur.value+k).slice(0,3);cur.style.borderColor='';const f=fields.find(x=>'f_'+x.k===cur.id);if(f&&f.s)$('#nm_'+f.k).textContent=pname(f.s,cur.value)};
  $('#ov').querySelectorAll('#kp button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  $('#no').onclick=()=>{closeOv();MO=null};
  $('#yes').onclick=()=>{
    const v={};
    for(const f of fields){v[f.k]=$('#f_'+f.k).value.trim();if(f.r&&!v[f.k]){$('#f_'+f.k).focus();$('#f_'+f.k).style.borderColor='#dc2626';return}}
    closeOv();ok(v);
  };
  $('#ov').onkeydown=e=>{if(cur&&e.target===cur){if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫')}if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')$('#yes').click();if(e.key==='Escape')closeOv()};
}
function menu(t,items,c,msg){
  $('#ov').innerHTML='<div class="ov"><div class="md"><h3>'+esc(t)+'</h3>'+(msg?'<p>'+esc(msg)+'</p>':'')+'<div class="tb" id="mb"></div></div></div>';
  items.concat([[items.length?'Abbrechen':'OK',()=>{MO=null}]]).forEach((it,i)=>{
    const b=document.createElement('button');b.textContent=it[0];
    if(c&&i<items.length){b.style.background=c;b.style.color=ink(c);b.style.border='0'}
    b.onclick=()=>{closeOv();it[1]()};$('#mb').appendChild(b);
  });
}
/* ---------- Aktionen ---------- */
const NUM={k:'num',l:'Rückennummer (optional)',n:1};
const numF=s=>({k:'num',l:'Rückennummer (optional)',n:1,s});
const GRUND={k:'rs',l:'Grund',t:'select',o:[['Unsportlichkeit','Unsportlichkeit'],['Foulspiel','Foulspiel']]};
function nachtrag(){
  MO=null;
  ask('Nachtrag',[{k:'s',l:'Mannschaft',t:'select',o:[['h',S.h.n],['a',S.a.n]]},{k:'e',l:'Ereignis',t:'select',o:[['tor','Tor'],['Gelbe Karte','Gelbe Karte'],['Gelb-Rote Karte','Gelb-Rote Karte'],['Rote Karte','Rote Karte'],['w','Wechsel']]},{k:'m',l:'Spielminute',r:1,n:1}],v=>{
    const m=parseInt(v.m,10);if(!(m>=0))return;
    MO={min:m+'’',t:m,per:m<=S.half?PN[0]:m<=2*S.half?PN[1]:'Verlängerung'};
    if(v.e==='tor')goal(v.s);else if(v.e==='w')sub(v.s);else if(v.e==='Gelb-Rote Karte')yr(v.s);else who(v.s,v.e);
  },'Ereignis nachträglich eintragen. Die Minute bestimmt die Position in der Übersicht.');
}
function teamMenu(s){
  if(S.screen!=='match')return;
  MO=null;
  menu(tn(s),[['Tor',()=>goal(s)],['Gelbe Karte',()=>who(s,'Gelbe Karte')],['Gelb-Rote Karte',()=>yr(s)],['Rote Karte',()=>who(s,'Rote Karte')],['Wechsel',()=>sub(s)]],col(s));
}
function goal(s){
  ask('Tor – '+tn(s),[{k:'art',l:'Art des Tores',t:'select',o:[['Tor','Tor'],['Strafstoß-Tor','Strafstoß-Tor'],['Eigentor','Eigentor (der eigenen Mannschaft)']]},numF(s)],v=>add(s,v.art,{num:v.num,sc:v.art==='Eigentor'?opp(s):s,det:v.art==='Eigentor'?'Eigentor von '+tn(s)+' – Treffer für '+tn(opp(s)):''}));
}
function sub(s){const nn=n=>pname(s,n)?' '+pname(s,n):'';ask('Wechsel – '+tn(s),[{k:'o',l:'Nummer ausgewechselt',r:1,n:1,s},{k:'i',l:'Nummer eingewechselt',r:1,n:1,s}],v=>add(s,'Wechsel',{num:v.i,det:'Nr. '+v.o+nn(v.o)+' raus, Nr. '+v.i+nn(v.i)+' rein'}))}
function who(s,type){menu(type+' – '+tn(s),[['Spieler',()=>card(s,type,'P')],['Teamoffizieller',()=>card(s,type,'O')]],col(s))}
function yellowNums(s){
  const st={};
  S.ev.forEach(e=>{if(e.side===s&&e.who==='P'){if(e.type==='Gelbe Karte')st[e.num]=1;else if(e.type!=='Gelbe Karte'&&CARD.includes(e.type))st[e.num]=2}});
  return Object.keys(st).filter(n=>st[n]===1);
}
function card(s,type,w){
  const red=type==='Rote Karte';
  ask(type+' – '+tn(s)+(w==='P'?' (Spieler)':' (Teamoffizieller)'),[
    w==='P'?{k:'num',l:'Rückennummer',r:1,n:1,s}:(OF(s).length?{k:'role',l:'Teamoffizieller',t:'select',o:OF(s).map(x=>{const t=x.nm+(x.r?' ('+x.r+')':'');return[t,t]}).concat([['(ohne Angabe)','Andere / ohne Angabe']])}:{k:'role',l:'Funktion (z. B. Trainer, Betreuer)',r:1}),
    red?{k:'rs',l:'Begründung',t:'area',r:1}:GRUND
  ],v=>{
    if(w==='P'&&type==='Gelbe Karte'&&yellowNums(s).includes(v.num))return menu('Hinweis',[],null,'Nr. '+v.num+' hat bereits Gelb – bitte „Gelb-Rote Karte“ vergeben.');
    add(s,type,{num:w==='P'?v.num:'',who:w,reason:v.rs,det:w==='P'?'Spieler':'Offizieller – '+v.role});
  });
}
function yr(s){
  const n=yellowNums(s);
  if(!n.length)return menu('Gelb-Rote Karte',[],null,'Kein Spieler von '+tn(s)+' hat aktuell eine Gelbe Karte.');
  ask('Gelb-Rote Karte – '+tn(s),[{k:'num',l:'Spieler mit Gelber Karte',t:'select',o:n.map(x=>[x,'Nr. '+x+(pname(s,x)?' – '+pname(s,x):'')])},GRUND],v=>add(s,'Gelb-Rote Karte',{num:v.num,who:'P',reason:v.rs,det:'Spieler'}));
}
/* ---------- Uhr ---------- */
function startP(){
  if(S.active||S.p>=maxP())return;
  const n=S.p,def=n===1?opp(S.kos[0]):n===3?opp(S.kos[2]):'h',go=k=>{
    S.p++;S.kos[S.p-1]=k;S.active=true;S.run=true;S.base=0;S.t0=Date.now();add(k,'Anstoß',{det:PN[S.p-1]});
  };
  if(n===1||n===3)ask(PN[n]+' – Anpfiff',[],()=>go(def),'Anstoß hat: '+tn(def),'Anpfiff');
  else ask(PN[n]+' – Anpfiff',[{k:'k',l:'Anstoß durch',t:'select',o:[['h',S.h.n],['a',S.a.n]]}],v=>go(v.k),'','Anpfiff');
}
function pauseP(){if(!S.active)return;if(S.run){S.base=sec();S.run=false}else{S.t0=Date.now();S.run=true}save();render()}
function endP(){if(!S.active)return;S.ap=0;S.base=sec();S.run=false;S.active=false;add('-','Abschnitt beendet',{det:PN[S.p-1]})}
function undo(){
  let i=S.ev.length-1;while(i>=0&&(S.ev[i].type==='Anstoß'||S.ev[i].type==='Abschnitt beendet'))i--;
  if(i<0)return menu('Rückgängig',[],null,'Keine Aktion zum Rückgängigmachen vorhanden.');
  S.ev.splice(i,1);save();render();
}
function newGame(){ask('Neues Spiel',[],()=>{if(S.ev.length)archive(S);S=Object.assign(fresh(),{h:S.h,a:S.a,half:S.half,et:S.et||0});save();render()},'Zurück zur Spielvorbereitung? Das aktuelle Spiel wird vorher automatisch im Archiv gespeichert.')}
function startMatch(){
  const hn=$('#hn').value.trim(),an=$('#an').value.trim(),half=parseInt($('#hf').value,10),err=$('#err');
  if(!hn||!an)return err.textContent='Bitte beide Mannschaftsnamen eingeben.';
  if(hn.toLowerCase()===an.toLowerCase())return err.textContent='Die Mannschaftsnamen müssen unterschiedlich sein.';
  if(!(half>=1&&half<=120))return err.textContent='Die Halbzeitlänge muss zwischen 1 und 120 Minuten liegen.';
  S=Object.assign(fresh(),{screen:'match',h:{n:hn,c:$('#hc').value,pl:rdP('h'),of:rdO('h')},a:{n:an,c:$('#ac').value,pl:rdP('a'),of:rdO('a')},half,et:parseInt($('#et').value,10)||0,mid:Date.now()});save();render();
}
/* ---------- Übersicht ---------- */
const line=(e,full)=>(full?e.per+' | ':'')+e.min+' | '+tn(e.side)+': '+e.type+(e.num?' Nr. '+e.num+nmx(e):'')+(e.det?' — '+e.det:'')+(e.reason?' | '+e.reason:'');
const AK='refereeDesk.archive';
const getA=()=>{try{return JSON.parse(localStorage.getItem(AK))||[]}catch(e){return[]}};
const putA=a=>{try{localStorage.setItem(AK,JSON.stringify(a))}catch(e){}};
const scoreOf=ev=>{let h=0,a=0;ev.forEach(e=>{if(GOAL.includes(e.type))e.sc==='h'?h++:a++});return[h,a]};
const fn=st=>'Spielbericht_'+(st.h.n+'_'+st.a.n).replace(/[^\wäöüÄÖÜß]+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.txt';
function archive(st){
  st.mid=st.mid||Date.now();
  const sc=scoreOf(st.ev),a=getA().filter(x=>x.mid!==st.mid);
  a.unshift({mid:st.mid,ts:Date.now(),title:st.h.n+' '+sc[0]+':'+sc[1]+' '+st.a.n,st:JSON.parse(JSON.stringify(st))});
  putA(a.slice(0,50));save();
}
function archMenu(){
  const a=getA();
  menu('Archiv',a.map((x,i)=>[x.title+' · '+new Date(x.ts).toLocaleDateString('de-DE'),()=>archItem(i)]),null,a.length?'Gespeicherte Spiele auf diesem Gerät:':'Noch kein Spiel im Archiv. Speichere eins über „Bericht“ → „Im Archiv“.');
}
function archItem(i){
  const x=getA()[i];if(!x)return;
  menu(x.title,[
    ['Bericht ansehen',()=>{const b=S;S=x.st;try{report()}finally{S=b}}],
    ['Als aktuelles Spiel laden',()=>ask('Spiel laden',[],()=>{S=JSON.parse(JSON.stringify(x.st));S.screen='match';if(S.run){S.base+=(x.ts-S.t0)/1000;S.run=false}S.ap=0;save();render()},'Das aktuelle Spiel wird ersetzt. Speichere es vorher im Archiv, falls nötig.','Laden')],
    ['Löschen',()=>{const a=getA();a.splice(i,1);putA(a);archMenu()}]
  ]);
}
async function saveFile(name,data,m){
  try{
    if(typeof claude!=='undefined'&&claude.use){const d=await claude.use('downloads');if(!d)throw{code:'unavailable'};await d.save({filename:name,data});m.textContent='Datei gespeichert.';return}
    if(window.Android&&Android.saveText){Android.saveText(name,data);m.textContent='Datei im Ordner Downloads gespeichert.';return}
    const u=URL.createObjectURL(new Blob([data],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);m.textContent='Datei wird heruntergeladen.';
  }catch(e){m.textContent=e&&e.code==='declined'?'Speichern abgebrochen.':'Speichern als Datei nicht möglich – bitte „Kopieren“ nutzen.'}
}
function report(){
  const cur=S,[h,a]=score();
  const txt='Spielbericht: '+S.h.n+' – '+S.a.n+'\nSpielstand: '+h+':'+a+'\nHalbzeitlänge: '+S.half+' Minuten\n'+'='.repeat(60)+'\n'+S.ev.map(e=>line(e,true)).join('\n');
  $('#ov').innerHTML='<div class="ov"><div class="md"><h3>Spielbericht</h3><textarea id="rt" readonly>'+esc(txt)+'</textarea><p class="mut" id="cm"></p><div class="row" style="justify-content:flex-end"><button id="cp">Kopieren</button><button id="sv">Datei speichern</button><button id="ar">Im Archiv</button><button class="pri" id="cl">Schließen</button></div></div></div>';
  $('#cl').onclick=closeOv;
  $('#sv').onclick=()=>saveFile(fn(cur),txt,$('#cm'));
  $('#ar').onclick=()=>{archive(cur);$('#cm').textContent='Im Archiv auf diesem Gerät gespeichert.'};
  $('#cp').onclick=()=>{const t=$('#rt');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}$('#cm').textContent=ok?'In die Zwischenablage kopiert.':'Text ist markiert – bitte mit Strg/Cmd+C kopieren.'};
}
const cardIc=t=>'<i class="cd '+(t==='Gelbe Karte'?'y':t==='Rote Karte'?'rd':'yr')+'"></i>';
function ro(e,o){
  o=o||{};
  let ic='•',tx=esc(e.type);
  if(CARD.includes(e.type)){ic=cardIc(e.type);tx=(e.who==='O'?esc(e.det.replace('Offizieller – ','')):'Nr. '+esc(e.num)+esc(nmx(e)))+' · '+esc(e.reason);if(o.team)tx=esc(tn(e.side))+': '+tx}
  else if(GOAL.includes(e.type)){ic='⚽';tx='<b>'+esc(e.type)+'</b>'+(e.num?' Nr. '+esc(e.num)+esc(nmx(e)):'')+(e.det?' <span class="mut">('+esc(e.det)+')</span>':'');if(o.team)tx='<span class="dot" style="background:'+col(e.side)+'"></span>'+esc(tn(e.side))+' · '+tx;if(o.sc)tx+=' <b>'+o.sc+'</b>'}
  else if(e.type==='Wechsel'){ic='⇄';tx='<span class="dot" style="background:'+col(e.side)+'"></span>'+esc(tn(e.side))+' · '+esc(e.det)}
  else{tx='<span class="dot" style="background:'+col(e.side)+'"></span>'+esc(tn(e.side))+': '+esc(e.type)+(e.det?' — '+esc(e.det):'')+(e.num?' Nr. '+esc(e.num):'')}
  const dl=e.type!=='Anstoß'&&e.type!=='Abschnitt beendet';
  return'<div class="r'+(dl?' dl':'')+'"'+(dl?' onclick="delEv('+e.id+')"':'')+'><span class="m">'+esc(e.min)+'</span><span class="ic">'+ic+'</span><span>'+tx+'</span></div>';
}
function overview(){
  const E=S.ev.slice().sort((a,b)=>(b.t||0)-(a.t||0)||b.id-a.id),none='<p class="mut">Noch nichts erfasst.</p>';
  if(S.f==='k'){
    const t=s=>{
      const c=E.filter(e=>e.side===s&&CARD.includes(e.type)),P=c.filter(e=>e.who==='P'),O=c.filter(e=>e.who==='O');
      return'<div><div class="th" style="background:'+col(s)+';color:'+ink(col(s))+'">'+esc(tn(s))+'</div>'
        +'<div class="sh">Spieler ('+P.length+')</div>'+(P.map(e=>ro(e)).join('')||'<p class="mut">Keine Karten</p>')
        +'<div class="sh">Teamoffizielle ('+O.length+')</div>'+(O.map(e=>ro(e)).join('')||'<p class="mut">Keine Karten</p>')+'</div>';
    };
    return'<div class="g2">'+t('h')+t('a')+'</div>';
  }
  if(S.f==='t'){
    let h=0,a=0;const run={};
    S.ev.slice().sort((x,y)=>(x.t||0)-(y.t||0)||x.id-y.id).forEach(e=>{if(GOAL.includes(e.type)){e.sc==='h'?h++:a++;run[e.id]=h+':'+a}});
    return E.filter(e=>GOAL.includes(e.type)).map(e=>ro(e,{team:1,sc:run[e.id]})).join('')||none;
  }
  if(S.f==='w')return E.filter(e=>e.type==='Wechsel').map(e=>ro(e)).join('')||none;
  return E.map(e=>ro(e,{team:1})).join('')||none;
}
function delEv(id){const e=S.ev.find(x=>x.id===id);if(!e)return;menu('Eintrag löschen?',[['Löschen',()=>{S.ev=S.ev.filter(x=>x.id!==id);save();render()}]],'#dc2626',line(e,true))}
const setF=k=>{S.f=k;save();render()};
/* ---------- Anzeige ---------- */
const rrow=(k,a,b)=>k==='p'?'<div class="rw"><input class="pn" inputmode="numeric" placeholder="Nr." value="'+esc(a)+'"><input class="pm" placeholder="Name" value="'+esc(b)+'"><button onclick="this.parentNode.remove()">✕</button></div>':'<div class="rw"><input class="pm" placeholder="Name" value="'+esc(a)+'"><input class="pr" placeholder="Funktion (z. B. Trainer)" value="'+esc(b)+'"><button onclick="this.parentNode.remove()">✕</button></div>';
const addRow=(s,k)=>{const c=$('#'+s+k);c.insertAdjacentHTML('beforeend',rrow(k,'',''));c.lastElementChild.querySelector('input').focus()};
const rost=s=>{const T=s==='h'?S.h:S.a;return'<label>Spieler (optional)</label><div id="'+s+'p">'+(T.pl||[]).map(x=>rrow('p',x.n,x.nm)).join('')+'</div><button onclick="addRow(\''+s+'\',\'p\')">+ Spieler</button><label>Teamoffizielle (optional)</label><div id="'+s+'o">'+(T.of||[]).map(x=>rrow('o',x.nm,x.r)).join('')+'</div><button onclick="addRow(\''+s+'\',\'o\')">+ Teamoffizieller</button>'};
function render(){
  const app=$('#app');
  if(S.screen==='setup'){
    app.innerHTML='<div class="row sp"><h1>REFEREE DESK</h1><button onclick="archMenu()">Archiv</button></div><p class="mut">Spielvorbereitung</p>'
    +'<div class="card"><h3>Mannschaften</h3><div class="g2"><div><label>Heimmannschaft</label><input id="hn" value="'+esc(S.h.n)+'"><label>Farbe Heim</label><input type="color" id="hc" value="'+S.h.c+'">'+rost('h')+'</div>'
    +'<div><label>Gastmannschaft</label><input id="an" value="'+esc(S.a.n)+'"><label>Farbe Gast</label><input type="color" id="ac" value="'+S.a.c+'">'+rost('a')+'</div></div></div>'
    +'<div class="card"><h3>Spieleinstellungen</h3><label>Halbzeitlänge (Minuten)</label><input id="hf" type="number" min="1" max="120" value="'+S.half+'"><label>Verlängerung</label><select id="et">'+[[0,'Keine Verlängerung'],[5,'2 × 5 Minuten'],[10,'2 × 10 Minuten'],[15,'2 × 15 Minuten']].map(o=>'<option value="'+o[0]+'"'+((S.et||0)===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'
    +'<p class="mut">Den Anstoß legst du direkt vor dem Anpfiff jedes Abschnitts fest. Im Spiel tippst du auf die Mannschaftskachel, um Aktionen zu erfassen.</p>'
    +'<p id="err" style="color:#dc2626"></p><button class="pri" onclick="startMatch()">Spiel öffnen</button>';
    return;
  }
  const sc=score();
  const st=!S.p?'Vor dem Spiel':S.active?PN[S.p-1]+(S.run?'':' (pausiert)'):PN[S.p-1]+' beendet';
  const tabs=[['k','Karten'],['t','Tore'],['w','Wechsel'],['a','Alle']];
  app.innerHTML='<div class="row sp"><span class="mut">REFEREE DESK</span><div class="row"><button onclick="archMenu()">Archiv</button><button onclick="nachtrag()">+ Nachtrag</button><button onclick="newGame()">Neues Spiel</button></div></div>'
  +'<div class="score">'+['h','a'].map((s,i)=>'<div class="sc" style="background:'+col(s)+';color:'+ink(col(s))+'" onclick="teamMenu(\''+s+'\')">'+esc(tn(s))+'<b>'+sc[i]+'</b><small>Tippen für Aktionen</small></div>').join('')+'</div>'
  +'<div class="card" style="text-align:center"><div class="clk" id="clk">00:00</div><div class="mut" style="font-size:15px"><span>'+esc(st)+'</span><span id="cd"></span></div>'
  +'<div class="row" style="justify-content:center;margin-top:12px"><button class="pri" onclick="startP()"'+(S.active||S.p>=maxP()?' disabled':'')+'>'+(S.p<maxP()?esc(PN[S.p])+' starten':'Spielende')+'</button>'
  +'<button onclick="endP()"'+(S.active?'':' disabled')+'>Abschnitt beenden</button></div></div>'
  +'<div class="card"><div class="tabs">'+tabs.map(t=>'<button class="'+(S.f===t[0]?'on':'')+'" onclick="setF(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div><p class="mut" style="margin:0 0 6px">Eintrag antippen, um ihn zu löschen.</p>'+overview()+'</div>'
  +'<div class="bar"><button onclick="undo()">↩ Rückgängig</button><button onclick="pauseP()"'+(S.active?'':' disabled')+'>'+(S.run||!S.active?'Pause':'Weiter')+'</button><button class="pri" onclick="report()">Bericht</button></div>';
  tick();
}
let AC;
document.addEventListener('click',()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}});
let lv=0,lb=0;
function pulse(){
  const n=Date.now();
  if(n-lv>2000){lv=n;try{navigator.vibrate&&navigator.vibrate(1000)}catch(e){}}
  if(S.ap&&n-lb>1800){lb=n;beep()}
}
function ackAlarm(){S.ap=0;save();const a=$('#alm');if(a)a.hidden=true}
function beep(){
  try{if(!AC)return;[0,.5,1].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.3)})}catch(e){}
}
function tick(){const al=$('#alm');if(al)al.hidden=!S.ap;const c=$('#clk');if(c){const s=Math.floor(sec());c.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  const d=$('#cd');if(d){if(!S.active)d.textContent='';else{const r=(S.p>2?etm():S.half)*60-s;if(r<=0&&S.run){if(S.al!==S.p){S.al=S.p;S.ap=1;save()}pulse()}d.textContent=r>=0?'· Noch '+pad(Math.floor(r/60))+':'+pad(r%60):'· Nachspielzeit +'+pad(Math.floor(-r/60))+':'+pad(-r%60)}}}}
setInterval(tick,250);
render();
try{const wl=()=>navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)wl()});wl()}catch(e){}
</script>
</body>
</html>
