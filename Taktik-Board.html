<title>Schiedsrichter-Taktikboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Schiedsrichter-Arbeitsplatz – links Kader & Gespann, Mitte Spielfeld + Zeitleiste, rechts Sichtanalyse & Notizen */
:root{
  --bg:#E9EEEB; --panel:#F8FAF9; --panel-2:#EEF2F0; --ink:#16201B; --muted:#56655D; --line:#D2DBD6;
  --accent:#E0A800; --accent-ink:#1E1700; --accent-soft:#FFF2C2;
  --ok:#17834A; --bad:#C8102E; --warn:#7C8A83;
  --chip-ok:#DDF3E5; --chip-bad:#FBE0E4; --chip-warn:#E7ECE9;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 4px 14px rgba(20,30,25,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --panel:#161C19; --panel-2:#1D2420; --ink:#E5ECE8; --muted:#94A39B; --line:#2B3530;
  --accent:#F2BE1A; --accent-ink:#1E1700; --accent-soft:#3A3010;
  --ok:#3DD47E; --bad:#FF5A6E; --warn:#9AA7A0;
  --chip-ok:#173825; --chip-bad:#40161E; --chip-warn:#252D29;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --panel:#161C19; --panel-2:#1D2420; --ink:#E5ECE8; --muted:#94A39B; --line:#2B3530;
  --accent:#F2BE1A; --accent-ink:#1E1700; --accent-soft:#3A3010;
  --ok:#3DD47E; --bad:#FF5A6E; --warn:#9AA7A0;
  --chip-ok:#173825; --chip-bad:#40161E; --chip-warn:#252D29;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-columns:288px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "left center right";gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
header.top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand svg{flex:none}
.sep{width:1px;height:24px;background:var(--line)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.small{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.icon{padding:6px 7px}
.btn svg{width:16px;height:16px;flex:none}
select,input[type=text],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input[type=color]{width:30px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=checkbox]{accent-color:var(--accent)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0;box-shadow:var(--shadow)}
.side.left{grid-area:left}.side.right{grid-area:right}
.center{grid-area:center;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
details.sec{border-bottom:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15.5px;text-transform:uppercase;letter-spacing:.05em}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(45deg)}
.sec-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.row>label{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:12px;line-height:1.45}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column;gap:3px}
.prow{display:grid;grid-template-columns:22px 46px minmax(0,1fr) 28px;gap:5px;align-items:center}
.prow input[type=number]{width:100%;padding:3px 4px;text-align:center}
.prow input[type=text]{width:100%;padding:3px 6px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25);cursor:pointer;padding:0}
.dot.gk{border-radius:5px}
.prow.sel{background:var(--accent-soft);border-radius:6px}
.lockbtn{border:1px solid transparent;background:none;cursor:pointer;border-radius:5px;padding:3px;color:var(--muted)}
.lockbtn.on{color:var(--bad);border-color:var(--line)}
.lockbtn svg{width:15px;height:15px}
.offrow{display:grid;grid-template-columns:56px 1fr auto auto;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--chip-ok);color:var(--ok)}
.pill.bad{background:var(--chip-bad);color:var(--bad)}
.pill.warn{background:var(--chip-warn);color:var(--warn)}
/* toolbar */
.toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);scrollbar-width:thin}
.tgroup{display:flex;gap:2px;align-items:center;padding-right:6px;border-right:1px solid var(--line)}
.tgroup:last-child{border-right:0}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent;background:none;border-radius:7px;padding:4px 6px;cursor:pointer;min-width:46px;color:var(--ink)}
.tbtn span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.tbtn svg{width:19px;height:19px}
.tbtn:hover{background:var(--panel-2)}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent)}
.tbtn.on span{color:var(--ink)}
.tsel{font-size:12px;padding:3px 4px}
/* stage */
.stage-wrap{position:relative;flex:1;min-height:260px;border-radius:12px;overflow:hidden;background:#1F4F31;box-shadow:var(--shadow)}
#stage{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#stage text{font-family:var(--f-body);pointer-events:none}
#stage [data-ent],#stage [data-alt],#stage [data-draw],#stage [data-h],#stage [data-sight]{cursor:pointer}
.hud{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-msg{background:rgba(10,20,14,.78);color:#EAF2EC;border-radius:8px;padding:5px 9px;font-size:12px;max-width:62%}
.hud-msg:empty{display:none}
.zoom{display:flex;gap:4px}
.zoom button{background:rgba(10,20,14,.78);color:#fff;border:0;border-radius:7px;width:32px;height:32px;font-size:18px;cursor:pointer}
/* timeline */
.timeline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{min-width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-family:var(--f-mono);font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#scrub{flex:1;min-width:120px}
/* right */
.switches{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.sw{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px}
.sw.full{grid-column:1/-1}
table.an{width:100%;border-collapse:collapse;font-size:12.5px}
table.an th{font-weight:600;color:var(--muted);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:3px 4px;border-bottom:1px solid var(--line)}
table.an td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.an td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.sl{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.sl .c{width:10px;height:10px;border-radius:50%}
.sl.sel{background:var(--accent-soft)}
.sl .nm{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea#notes{width:100%;min-height:150px;resize:vertical;line-height:1.5}
.qchips{display:flex;flex-wrap:wrap;gap:4px}
.disclaimer{font-size:11.5px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 8px;background:var(--panel-2);border-radius:0 6px 6px 0;line-height:1.45}
/* modal */
#modal{position:fixed;inset:0;background:rgba(8,14,11,.55);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:880px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.mhead h2{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.mbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2);display:flex;flex-direction:column}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card svg{display:block;width:100%;height:auto;max-width:100%;cursor:pointer;background:#25603A}
.card .cb{padding:8px;display:flex;flex-direction:column;gap:6px}
.card .cb input{width:100%}
.plrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.plrow .nm{flex:1;min-width:140px;font-weight:600}
.plrow.cur .nm::after{content:" · geöffnet";color:var(--muted);font-weight:400}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#14201A;color:#EEF4F0;padding:9px 14px;border-radius:9px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
#toast:empty{display:none}
.mob{display:none}
.scrim{display:none}
@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "center"}
  .side{position:fixed;top:0;bottom:0;width:min(350px,90vw);z-index:40;border-radius:0;transition:transform .2s ease;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.left{left:0;transform:translateX(-105%);padding-left:env(safe-area-inset-left,0px)}
  .side.right{right:0;transform:translateX(105%);padding-right:env(safe-area-inset-right,0px)}
  .side.open{transform:none}
  .mob{display:inline-flex}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
}
@media (max-width:640px){
  .brand span.long{display:none}
  .hide-s{display:none}
  .tbtn{min-width:40px;padding:3px 4px}
  .stage-wrap{min-height:52vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <button class="btn icon mob" data-act="drawer" data-side="left" aria-label="Kader und Vorlagen öffnen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="3" y="3" width="2" height="21" rx="1" fill="currentColor"/><rect x="5" y="3" width="16" height="11" fill="#E0A800"/><path d="M5 3h4v3.7H5zM13 3h4v3.7h-4zM9 6.7h4v3.6H9zM17 6.7h4v3.6h-4zM5 10.3h4V14H5zM13 10.3h4V14h-4z" fill="#C8102E"/></svg>SR-Taktikboard<span class="long" style="font-weight:600;color:var(--muted)">&nbsp;· Gespann</span></div>
    <span class="sep hide-s"></span>
    <button class="btn" data-act="projects" title="Projekte verwalten"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5h4l1.3 1.5H14v7H2z"/></svg><span id="projName">Projekt</span></button>
    <select id="sceneSel" aria-label="Szene wählen" style="max-width:240px"></select>
    <button class="btn" data-act="newScene" title="Neue leere Szene (Grundaufstellung)">+ Szene</button>
    <button class="btn" data-act="overview" title="Projektübersicht mit Vorschauen">Übersicht</button>
    <span class="grow"></span>
    <button class="btn icon" id="undoBtn" data-act="undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 010 8H6"/></svg></button>
    <button class="btn icon" id="redoBtn" data-act="redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 3l3 3-3 3"/><path d="M14 6H7a4 4 0 000 8h3"/></svg></button>
    <button class="btn primary" data-act="export">Export</button>
    <button class="btn icon mob" data-act="drawer" data-side="right" aria-label="Sichtanalyse und Notizen öffnen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg></button>
  </header>

  <aside class="side left" id="left"></aside>

  <main class="center">
    <div class="toolbar" id="toolbar"></div>
    <div class="stage-wrap" id="stageWrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><g id="world"></g></svg>
      <div class="hud">
        <div class="hud-msg" id="hudMsg"></div>
        <div class="zoom">
          <button data-act="zoomOut" aria-label="Verkleinern">−</button>
          <button data-act="zoomIn" aria-label="Vergrößern">+</button>
        </div>
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
  </main>

  <aside class="side right" id="right"></aside>
</div>
<div class="scrim" id="scrim" data-act="closeDrawers"></div>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
/* ===================== Grundlagen ===================== */
const L = 105, W = 68;
const AIDS = Array.from({length:11}, (_, i) => 'A' + (i + 1));
const BIDS = Array.from({length:11}, (_, i) => 'B' + (i + 1));
const PLAYERS = [...AIDS, ...BIDS];
const OFFS = ['SR', 'SRA1', 'SRA2'];
const PERSONS = [...PLAYERS, ...OFFS];
const ENTS = [...PERSONS, 'BALL', 'EV'];
const OFF_LABEL = {SR:'SR', SRA1:'SRA 1', SRA2:'SRA 2'};
const STATUS_COL = {clear:'#2BD46A', blocked:'#FF3B4E', unclear:'#C9D1CC'};
const STATUS_TXT = {clear:'frei', blocked:'mögl. verdeckt', unclear:'unklar'};
const STAMPS = {
  foul:{t:'F', fill:'#E63946', ink:'#fff', name:'Foul'},
  hand:{t:'H', fill:'#F4A261', ink:'#1a1a1a', name:'Handspiel'},
  goal:{t:'T', fill:'#ffffff', ink:'#111', name:'Tor?'},
  card:{t:'K', fill:'#FFD60A', ink:'#111', name:'Persönliche Strafe'},
  to:{t:'TO', fill:'#7B2CBF', ink:'#fff', name:'Teamoffizieller'},
};
const PALETTE = {auto:null, weiss:'#ffffff', gelb:'#FFD23F', rot:'#FF3B4E', blau:'#4CC9F0', orange:'#FF7B54', schwarz:'#111111', lila:'#B388FF'};

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = n => Math.round(n * 100) / 100;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
const angDiff = (a, b) => ((b - a) % 360 + 540) % 360 - 180;
const lerp = (a, b, f) => a + (b - a) * f;
const lerpAng = (a, b, f) => a + angDiff(a, b) * f;
const bez = (p0, c, p1, t) => { const u = 1 - t; return {x:u*u*p0.x + 2*u*t*c.x + t*t*p1.x, y:u*u*p0.y + 2*u*t*c.y + t*t*p1.y}; };
const midp = (a, b) => ({x:(a.x + b.x) / 2, y:(a.y + b.y) / 2});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtM = m => (Math.round(m * 10) / 10).toFixed(1).replace('.', ',') + ' m';
const teamOf = id => (id[0] === 'A' || id[0] === 'B') && /^[AB]\d+$/.test(id) ? id[0] : null;
const isGK = id => id === 'A1' || id === 'B1';
function contrast(hex){
  const h = (hex || '#000').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#111' : '#fff';
}

/* ===================== Formationen & Szenarien ===================== */
// Slot je Rückennummer 1..11: [Rolle, y für Mannschaft A (greift nach rechts an)]
const FORMS = {
  '4-4-2':  [['GK',34],['D',58],['D',10],['D',42],['D',26],['M',41],['M',58],['M',27],['F',40],['F',28],['M',10]],
  '4-3-3':  [['GK',34],['D',58],['D',10],['D',42],['D',26],['M',34],['F',56],['M',46],['F',34],['M',22],['F',12]],
  '4-2-3-1':[['GK',34],['D',58],['D',10],['D',42],['D',26],['M',41],['AM',56],['M',27],['F',34],['AM',34],['AM',12]],
  '3-5-2':  [['GK',34],['M',60],['M',8],['D',34],['D',48],['M',34],['D',20],['M',46],['F',40],['F',28],['M',22]],
};
function layoutTeam(team, form, prm, ballY){
  const [gk, def, mid, fwd] = prm; const out = {};
  (FORMS[form] || FORMS['4-4-2']).forEach(([role, ys], i) => {
    const wide = role === 'D' && (ys > 50 || ys < 18);
    let v = role === 'GK' ? gk : role === 'D' ? def + (wide ? 2 : 0) : role === 'M' ? mid : role === 'AM' ? (mid + fwd) / 2 : fwd;
    let y0 = team === 'A' ? ys : W - ys;
    let y = role === 'GK' ? 34 + (ballY - 34) * 0.12 : 34 + (y0 - 34) * 0.82 + (ballY - 34) * 0.28;

function wall(ids, ball, d = 9.15, goal = [105, 34], gap = 0.72){
  const [bx, by] = ball, ang = Math.atan2(goal[1] - by, goal[0] - bx);
  const cx = bx + Math.cos(ang) * d, cy = by + Math.sin(ang) * d, px = -Math.sin(ang), py = Math.cos(ang);
  const o = {}; ids.forEach((id, i) => { const k = (i - (ids.length - 1) / 2) * gap; o[id] = [r2(cx + px * k), r2(cy + py * k)]; });
  return o;
}
function wallCenter(ball, d = 9.15, goal = [105, 34]){
  const ang = Math.atan2(goal[1] - ball[1], goal[0] - ball[0]);
  return [r2(ball[0] + Math.cos(ang) * d), r2(ball[1] + Math.sin(ang) * d)];
}

  S.proj = JSON.parse(json); S.proj.scenes.forEach(s => { if (s.id in notes) s.notes = notes[s.id]; });
  S.t = clamp(S.t, 0, curScene().frames.length - 1); validateSel(); save(); renderAll();
}
function undo(){ if (!S.undo.length) return; S.redo.push(snap()); restore(S.undo.pop()); updUndo(); }
function redo(){ if (!S.redo.length) return; S.undo.push(snap()); restore(S.redo.pop()); updUndo(); }
function updUndo(){ $('#undoBtn').disabled = !S.undo.length; $('#redoBtn').disabled = !S.redo.length; }
function validateSel(){
  const sc = curScene(), s = S.sel; if (!s) return;
  if (s.k === 'draw' && !sc.drawings.find(d => d.id === s.id)) S.sel = null;
  if (s.k === 'sight' && !sc.sights.find(d => d.id === s.id)) S.sel = null;
  if (s.k === 'alt' && !sc.alts.find(d => d.id === s.id)) S.sel = null;
  if (s.k === 'ent' && s.id === 'EV' && !sc.hasEv) S.sel = null;
}

function svgPt(cx, cy){ const m = svg.getScreenCTM(); if (!m) return {x:0, y:0}; const p = svg.createSVGPoint(); p.x = cx; p.y = cy; const q = p.matrixTransform(m.inverse()); return {x:q.x, y:q.y}; }
function fieldPt(e){ const m = world.getScreenCTM(); if (!m) return {x:0, y:0}; const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(m.inverse()); return {x:q.x, y:q.y}; }
function zoomAt(pt, f){
  const v = S.view; const nw = clamp(v.w * f, 8, 170); f = nw / v.w;
  S.view = {x:pt.x - (pt.x - v.x) * f, y:pt.y - (pt.y - v.y) * f, w:v.w * f, h:v.h * f}; draw();
}

function selLabel(){
  const sc = curScene(), s = S.sel, p = S.proj; if (!s) return '';

  if (s.k === 'alt'){ const a = sc.alts.find(x => x.id === s.id); return 'SR-Alternative ' + (a ? a.n : ''); }
  if (s.k === 'sight') return 'Sichtlinie';
  if (s.k === 'draw'){ const d = sc.drawings.find(x => x.id === s.id); return d ? drawName(d) : ''; }
  return '';

/* ===================== Szenen & Schritte ===================== */
function switchScene(i, fromPlay){
  curScene().at = fi(); S.proj.cur = clamp(i, 0, S.proj.scenes.length - 1);
  S.t = fromPlay ? 0 : (curScene().at || 0); S.sel = null; S.pending = null; S.hold = 0; save(); renderPanels(); draw();
}
function setPos(id, x, y){
  const sc = curScene(); if (S.t !== Math.round(S.t)) S.t = fi();
  const nx = r2(clamp(x, -6, L + 6)), ny = r2(clamp(y, -6, W + 6));
  if (id === 'EV'){ sc.frames.forEach(f => { f.EV = {x:nx, y:ny}; }); return; }
  const f = sc.frames[fi()]; f[id] = {...f[id], x:nx, y:ny};
}
function addFrame(){
  mutate(() => { const sc = curScene(), i = fi(); sc.frames.splice(i + 1, 0, clone(sc.frames[i])); sc.drawings.forEach(d => { if (d.t === 'arrow' && d.step > i) d.step++; }); S.t = i + 1; }, false);
  tlSig = ''; toast('Neuer Schritt angelegt – jetzt Personen verschieben.');
}
function delFrame(){
  const sc = curScene(); if (sc.frames.length < 2) return;
  mutate(() => { const i = fi(); sc.frames.splice(i, 1); sc.drawings.forEach(d => { if (d.t === 'arrow' && typeof d.step === 'number'){ if (d.step >= sc.frames.length) d.step = sc.frames.length - 1; else if (d.step > i) d.step--; } }); S.t = clamp(i - 1, 0, sc.frames.length - 1); }, false);
  tlSig = '';
}
function framesFromRuns(){
  const sc = curScene(), i = fi(); const arr = sc.drawings.filter(d => d.t === 'arrow' && d.owner && d.step === i);
  if (!arr.length){ toast(`Keine verknüpften Laufwege für Schritt ${i + 1}. Laufwege auf einer Person beginnen lassen.`); return; }
  mutate(() => {
    if (i + 1 >= sc.frames.length) sc.frames.push(clone(sc.frames[i]));
    const nf = sc.frames[i + 1]; arr.forEach(d => { nf[d.owner] = {...nf[d.owner], x:r2(d.p1.x), y:r2(d.p1.y)}; });
    S.t = i + 1;
  }, false);
  tlSig = ''; toast(`${arr.length} Laufweg(e) in Schritt ${i + 2} übernommen.`);
}
let lastTs = 0;
function tick(ts){
  if (!S.playing) return; const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0; lastTs = ts;
  const sc = curScene(), n = sc.frames.length;
  if (n < 2){ S.hold += dt; if (S.hold > 2.2) nextOrStop(); }
  else { S.t += dt * S.speed / 1.6; if (S.t >= n - 1){ S.t = n - 1; S.hold += dt; if (S.hold > 0.9 || !S.playAll) nextOrStop(); } }
  drawNow(); if (S.playing) requestAnimationFrame(tick);
}
function nextOrStop(){
  if (S.playAll && S.proj.cur < S.proj.scenes.length - 1){ switchScene(S.proj.cur + 1, true); }
  else { S.playing = false; S.playAll = false; S.hold = 0; tlSig = ''; renderSel(); draw(); }

function wrapText(str, max){

    let line = ''; par.split(/\s+/).forEach(w => { if ((line + ' ' + w).trim().length > max){ if (line) out.push(line); line = w; } else line = (line + ' ' + w).trim(); });
    out.push(line);

}

    const img = new Image(); const url = URL.createObjectURL(new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'}));
    img.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Grafik konnte nicht gerendert werden.')); };
    img.src = url;
  });
}
const pdfTxt = s => String(s || '').replace(/[„“”]/g, '"').replace(/[‚‘’]/g, "'").replace(/[–—]/g, '-').replace(/→/g, '->').replace(/←/g, '<-').replace(/•/g, '-').replace(/×/g, 'x').replace(/[^\x00-\xFF]/g, '');
const fileBase = s => String(s || 'szene').replace(/[^\wäöüÄÖÜß-]+/g, '_').slice(0, 60);
ACT.doExport = async () => {
  const btn = $('#expBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Wird erstellt …'; }
  try {
    curScene().at = fi();
    if (EXP.fmt === 'json'){ ACT.exportJson(); }
    else if (EXP.fmt === 'png'){
      const sc = curScene(); const {svg:s, ratio} = exportSVG(sc, S.t, EXP.layers, EXP.layers.notes); const w = 2400;
      const c = await svgToCanvas(s, w, Math.round(w * ratio)); const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      if (!blob) throw new Error('PNG konnte nicht erzeugt werden.'); await saveFile(fileBase(sc.name) + '.png', blob);
    } else {
      const list = EXP.fmt === 'pdf1' ? [curScene()] : S.proj.scenes.filter(s => EXP.scenes[s.id] !== false);
      if (!list.length) throw new Error('Keine Szene ausgewählt.');
      const doc = new window.jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
      for (let i = 0; i < list.length; i++){
        const sc = list[i]; const t = sc === curScene() ? S.t : (sc.at || 0); if (i) doc.addPage();
        const {svg:s} = exportSVG(sc, t, EXP.layers, false); const c = await svgToCanvas(s, 2000, Math.round(2000 * 82 / 119));
        const showText = EXP.layers.notes;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(22, 32, 27);
        if (showText) doc.text(pdfTxt(sc.name), 12, 14);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(86, 101, 93);
        doc.text(pdfTxt(`${S.proj.name} - Szene ${S.proj.scenes.indexOf(sc) + 1} - Schritt ${Math.round(t) + 1}/${sc.frames.length}`), 285, 14, {align:'right'});
        const iw = showText ? 186 : 273, ih = iw * 82 / 119; doc.addImage(c.toDataURL('image/png'), 'PNG', 12, 19, iw, ih);
        if (showText){
          let y = 24; const x = 204, wcol = 81;
          doc.setTextColor(22, 32, 27); doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text('Positionierungsanalyse', x, y); y += 5;
          const an = analysisRows(sc, t); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.6);
          doc.text(pdfTxt('Ziel: ' + entityLabel(S.proj, an.tgtId)), x, y); y += 4.4;
          an.rows.forEach(r => {
            const txt = pdfTxt(`${r.label}: ${fmtM(r.d)}, Sicht ${STATUS_TXT[r.status]}${r.blockers.length ? ' (' + r.blockers.map(b => entityLabel(S.proj, b)).join(', ') + ')' : ''}${r.inCone === null ? '' : r.inCone ? ', im Kegel' : ', außerhalb Kegel'}`);
            doc.splitTextToSize(txt, wcol).forEach(l => { doc.text(l, x, y); y += 4; });
          });
          y += 3; doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text('Notizen', x, y); y += 5;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
          const nl = doc.splitTextToSize(pdfTxt(sc.notes || '-'), wcol);
          for (const l of nl){ if (y > 200){ doc.addPage(); y = 16; } doc.text(l, x, y); y += 4.3; }
          doc.setFontSize(7.5); doc.setTextColor(86, 101, 93);
          doc.text(pdfTxt('Sichtanalyse = geometrische Näherung in der Draufsicht, keine verbindliche Aussage über die tatsächliche Sicht.'), 12, 203);
        }
      }
      const blob = doc.output('blob');
      await saveFile((EXP.fmt === 'pdf1' ? fileBase(curScene().name) : fileBase(S.proj.name) + '_Szenen') + '.pdf', blob);
    }
    closeModal();
  } catch (err){ toast('Export fehlgeschlagen: ' + err.message); if (btn){ btn.disabled = false; btn.textContent = 'Exportieren'; } }
};
