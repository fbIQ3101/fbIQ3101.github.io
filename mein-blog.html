<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mein Blog</title>
  <meta name="description" content="Ein moderner Blog mit Beiträgen, Kategorien und Kommentaren.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c4532d'/%3E%3Cpath d='M20 46V18h13a9 9 0 0 1 0 18H20m13 0a10 10 0 0 1 0 20' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Design (hell/dunkel) vor dem ersten Zeichnen setzen – verhindert Aufblitzen */
    (function () {
      try {
        var t = localStorage.getItem('blog.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Zum Inhalt springen</a>
  <div id="root">
    <div class="boot" aria-label="Blog wird geladen"><span></span></div>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Bitte aktiviere JavaScript, um den Blog zu nutzen.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
